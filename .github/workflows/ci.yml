name: CI

on:
  # `push` is filtered to main on purpose. Without a branch filter, a push to a
  # PR branch fires BOTH `push` and `pull_request`, so every job without a
  # job-level `if:` ran twice on the same commit — measured at ~18.4 minutes of
  # duplicated machine time and 4 concurrency slots per PR. Filtering here fixes
  # that at the source, for every job at once, instead of per-job guards that
  # each have to be kept in sync.
  #
  # The consequence to keep in mind when adding a job: on a PR branch there is
  # now NO push event. A job that wants to run on PRs must therefore have either
  # no job-level `if:` at all, or one that admits `pull_request` — a guard of
  # `github.event_name == 'push'` now means "main only", which is a legitimate
  # thing to want (see benchmark-summary) but a silent loss of coverage if it
  # was meant to mean "always".
  #
  # A branch filter also drops tag pushes, which the unfiltered `push:` used to
  # catch: `v*` tags no longer run this workflow. That is intended, not lost
  # coverage. A release tag is cut from a commit already on main, so this
  # workflow has already run on that exact commit — a tag-push run was a third
  # copy of the same result. Release artifacts are gated by release.yml, which
  # keeps its own `push: tags: ['v*']` trigger and is unaffected by this filter.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default GITHUB_TOKEN permissions for every job in this workflow, minimized to what
# the common case needs (checkout). The one job that needs more (benchmark-summary,
# which pushes to gh-pages and reads Actions run status) declares its own job-level
# `permissions:`, which overrides this top-level block for that job only.
permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_cache
  # gtest suites contributed by the five CUDA-only test TUs, defined once here because both
  # `cuda-compile` and `windows-cuda-compile` select on it. A sixth CUDA TU means editing this
  # one line, not two job bodies that can drift.
  #
  # `Cuda*` and nothing else, on purpose. test_cuda_rich_exit.cpp also registers a
  # `RngObservabilityFacilitySmoke` suite, and widening the filter to pick it up would be
  # actively harmful: test_metal_root_gen.cpp registers a same-named suite behind
  # `#if defined(__APPLE__)`, so on a hypothetical macOS leg that name alone would satisfy
  # the "at least one case was selected" assertion in scripts/ci_verify_cuda_test_tus.sh with
  # zero CUDA TUs compiled — the exact false green the assertion exists to prevent. Nothing is
  # lost by excluding it: each of the five TUs still contributes at least one `Cuda*` suite
  # (CudaKShapePool / CudaGeomPoolRebuild / CudaKShapeFilterParity / CudaComponentMaskParity /
  # CudaRichExit), so every file is represented.
  CUDA_TU_GTEST_FILTER: "Cuda*"

jobs:
  # Build + unit tests run once per PR and once per push to main.
  # E2E tests run separately on pull_request and push to main (see e2e-test job).
  #
  # No job-level `if:` — the workflow-level `on: push: branches: [main]` /
  # `pull_request` pair already yields exactly one run per commit. The guard that
  # used to sit here (`github.event_name == 'push'`) predates that filter and now
  # would mean "never run on a PR".
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x86_64
            os: ubuntu-24.04
            build_gui: ON
            cache_key: ubuntu-x64
            ccache: true
            # The one leg that both builds the GUI and has a headless GL stack available
            # (Xvfb + Mesa llvmpipe), so it is where the visual-regression layer actually
            # runs. Which reference groups it may run, and why not the others, is measured
            # and argued in doc/testing-architecture.md §4.6 — read that before widening it.
            run_gui_visual: ON

          - name: Ubuntu ARM64
            os: ubuntu-24.04-arm
            build_gui: OFF
            cache_key: ubuntu-arm64
            ccache: true

          - name: macOS ARM64
            os: macos-15
            build_gui: ON
            cache_key: macos-arm64
            ccache: true

          # windows-2022, NOT windows-2025 — this leg must compile on the SAME
          # image release.yml's `windows-x64` artifact is built on. A build leg
          # pinned to a different image is testing a configuration nobody ships:
          # the C2026 fixed by PR #316 (a shader raw string literal past MSVC's
          # 16384-byte cap) compiled clean here under VS 2026 and only surfaced
          # in the release build under VS 2022 — a green that did not mean what
          # it was read to mean.
          #
          # The divergence was never a decision. `windows-2025` used to ship
          # VS 2022; GitHub rolled its only Visual Studio install forward to
          # VS 2026 underneath the name, and only the legs that visibly broke
          # (windows-cuda-compile, release.yml) were moved off it. This one
          # stayed put because nothing broke. Image names change meaning under
          # your feet — when one does, re-check every leg pinned to it, not just
          # the red ones.
          #
          # Accepted loss: no CI leg compiles under VS 2026 any more. That
          # coverage was forward insurance for the day windows-2022 retires, and
          # it is given up on purpose — the migration is forced whenever that
          # image goes away, so learning about it early buys little.
          - name: Windows MSVC x86_64
            os: windows-2022
            build_gui: ON
            cache_key: windows-msvc-x64
            msvc: true

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7

      # GUI builds need icon resources from LFS, but NOT test reference images.
      # Selective fetch saves ~16MB bandwidth per run vs `lfs: true`.
      - name: Fetch LFS icon resources
        if: matrix.build_gui == 'ON'
        run: git lfs pull --include="resources/*"

      # The one leg that compares against reference images needs them materialized: without
      # this pull the working tree holds LFS pointer text, and CheckAgainstReference reports
      # "reference not found" — a red that looks like a missing file rather than a missing
      # fetch. Still selective: this is ~3MB, not the full ~16MB the icon step avoids.
      - name: Fetch LFS GUI reference images
        if: matrix.run_gui_visual == 'ON'
        run: git lfs pull --include="test/gui/references/*"

      # MSVC: set up Visual Studio environment before configure/build
      - name: Set up MSVC
        if: matrix.msvc
        uses: ilammy/msvc-dev-cmd@v1

      # sccache as a compiler launcher on the Windows leg. The install itself (pinned release,
      # SHA-256 checked) is the local composite action, the one copy every Windows job that
      # caches compilation uses.
      #
      # LUMICE_COMPILER_LAUNCHER_ARGS follows the LUMICE_PYTHON_ARGS pattern below: matrix
      # entries that write it get a launcher, every other entry evaluates the unset variable
      # to an empty string, and the shared Configure step needs no branch of its own. The
      # name is deliberately not tool-specific — the ccache entries write the same variable,
      # and two spellings for one thing is how they drift apart.
      - name: Install sccache (Windows MSVC)
        if: matrix.msvc
        uses: ./.github/actions/install-sccache
        with:
          cache-size: 800M

      - name: Route compilation through sccache (Windows MSVC)
        if: matrix.msvc
        shell: pwsh
        run: echo "LUMICE_COMPILER_LAUNCHER_ARGS=-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $env:GITHUB_ENV

      # The same treatment for the three non-Windows entries (`ccache: true`). Deliberately
      # the same shape as the sccache step above rather than a second invention: same
      # launcher-via-env-var injection, and the same "one entry per commit with a prefix
      # fallback" key. Every entry in this job is compile-bound once IPO is off (Configure
      # below): the link that used to dominate is 2-6 s, so what is left of Build is
      # compilation, which is exactly what a cache replays. macOS and ARM64 went uncached
      # while the LTO link was the floor; with it gone they measured 403/325 s cold against
      # 8-10 s warm.
      #
      # CCACHE_MAXSIZE is 800M, and it is 800M because the x64 leg was measured rather than
      # assumed to resemble its neighbour. It first shipped at 200M; on this leg 200M was
      # immediately over-full — `ccache --show-stats` reported 110.3% of the cap and a
      # 26.34% hit rate, i.e. the cap was evicting objects the next run needed. The same 800M
      # serves the ARM64 and macOS entries, whose measured directories are far smaller
      # (0.03 / 0.06 GB); a cap is an upper bound, and the quota is charged by what is
      # actually stored, not by the cap.
      - name: Install ccache (Ubuntu x86_64 / ARM64, macOS)
        if: matrix.ccache
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ccache; else sudo apt-get install -y ccache; fi
          ccache --version
          echo "LUMICE_COMPILER_LAUNCHER_ARGS=-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/ccache_cache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=800M" >> $GITHUB_ENV

      # Discriminator first, as everywhere else in this file — but be precise about what that
      # buys HERE, because it is not the collision the cpm keys were renamed to fix. The
      # shared-gui leg is already keyed `ccache-sharedgui-ubuntu-x64-`, which
      # `ccache-ubuntu-x64-` does not prefix: the two diverge at the first character after
      # `ccache-`. So spelling this leg `ccache-ubuntu-x64-` would be safe against today's
      # keys, and unsafe against tomorrow's — it is the one spelling that every future
      # `ccache-ubuntu-x64-<anything>-` key would silently fall back into, which is exactly
      # the shape that cost a measured 99.66% -> 2.35% hit rate when a branch tried it on the
      # cpm keys. Discriminator-first is what makes that shape unreachable by construction
      # instead of by nobody happening to add such a key. "static" is this leg's discriminator
      # word, chosen to contrast with `shared-gui-test-build`'s `BUILD_SHARED_LIBS=ON`
      # configure — this leg builds the static flavor, same sense as `-sj` meaning "shared
      # flavor" in the build script docs.
      #
      # Parameterized on cache_key, which for the x64 entry expands to the exact key it has
      # always had (`ccache-static-ubuntu-x64-`), so its existing entries keep hitting. No
      # entry's prefix is a prefix of another's: `ubuntu-x64-`, `ubuntu-arm64-` and
      # `macos-arm64-` diverge before their first `-`.
      - name: Cache ccache directory (Ubuntu x86_64 / ARM64, macOS)
        if: matrix.ccache
        uses: actions/cache@v6
        with:
          path: ccache_cache
          key: ccache-static-${{ matrix.cache_key }}-${{ github.sha }}
          restore-keys: ccache-static-${{ matrix.cache_key }}-

      # The restored directory carries the counters of every run it has passed through; zero
      # them so the statistics step after Build reports this run alone.
      - name: Zero ccache statistics
        if: matrix.ccache
        run: ccache -z

      # GLAD2 runs the Python code generator at CMake configure time (needs Jinja2).
      - name: Install GLAD2 Python dependencies (MSVC)
        if: matrix.msvc && matrix.build_gui == 'ON'
        shell: pwsh
        run: |
          python -m pip install jinja2
          $pythonDir = Split-Path (Get-Command python).Source
          echo "LUMICE_PYTHON_ARGS=-DPython_EXECUTABLE=$(Get-Command python | Select-Object -ExpandProperty Source)" >> $env:GITHUB_ENV

      # xvfb + the Mesa software rasterizer are here rather than in a step of their own so the
      # leg does a single apt-get update. They are what turns "gui_test needs a display" from a
      # blocker into a dependency: llvmpipe advertises a core profile well past the 3.3 core
      # context test_gui_main.cpp asks for, and no scene in the CI set needs a real GPU.
      # `apt-get update` fails as a whole — exit 100 — if any single configured source is
      # broken, and the runner image preinstalls third-party sources this repository never
      # installs anything from. On 2026-09-09 Google's Chrome repo served a `Packages.gz`
      # whose hash disagreed with its own Release file ("Hash Sum mismatch"), and that alone
      # turned every apt-using job on this workflow red for hours, on three separate reruns,
      # with a diff that touched none of them. Dropping the list is subtraction: nothing here
      # has ever installed a Google package, so the only thing that source contributed was a
      # dependency on a third party's index being self-consistent.
      #
      # Selected by CONTENT, not by filename. The first attempt at this removed
      # `google-chrome.list` by name and changed nothing — the `rm` ran, the source was still
      # configured, and the job failed on the identical error. The image spells that source
      # some other way (noble ships deb822 `.sources` files alongside `.list` ones), so a
      # guessed filename is a gate that silently does nothing. Grepping for the host removes
      # whatever file actually declares it.
      #
      # Scoped to the one vendor that has actually cost us a red, not to every file in the
      # directory: `ubuntu.sources` (the distro archive itself, which lives there on noble)
      # and anything a step installs for itself — the CUDA keyring below, for instance — must
      # survive, and a glob would take them with it. If a second vendor repo ever breaks a run
      # the same way, add its host to the pattern.
      #
      # The listing and the post-check are deliberate: this step is the only place that knows
      # what the image actually ships, and without them a future recurrence starts again from
      # a guess.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux' && matrix.build_gui == 'ON'
        run: |
          ls -la /etc/apt/sources.list.d/ || true
          sudo grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f
          grep -rn 'dl\.google\.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null || echo 'google source gone'
          sudo apt-get update
          sudo apt-get install -y \
            libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgtk-3-dev \
            xvfb libgl1-mesa-dri libglx-mesa0

      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: cpm_cache
          key: cpm-${{ matrix.cache_key }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: cpm-${{ matrix.cache_key }}-

      # sccache's disk cache, in a key namespace of its own so it can neither collide with nor
      # be confused for the `cpm-*` entries above — different content, different lifecycle.
      # The CPM cache can be content-addressed because its key hashes the CMakeLists.txt files
      # that fully determine what it holds; an sccache directory has no such key, since it
      # accumulates whatever this run happened to compile. So the closest correct shape is
      # "one entry per commit, falling back to the newest earlier one": the exact key never
      # hits on a new commit, which is what makes the post-step save a fresh entry, and
      # restore-keys then supplies the previous commit's directory, where the objects for
      # every file this commit did not touch still hit.
      - name: Cache sccache directory (Windows MSVC)
        if: matrix.msvc
        uses: actions/cache@v6
        with:
          path: sccache_cache
          key: sccache-windows-msvc-x64-${{ github.sha }}
          restore-keys: sccache-windows-msvc-x64-

      # LUMICE_IPO=OFF: without it every test binary is a full-program LTO link of lumice_obj
      # (140-363 s of this step per entry, 2-6 s without), and no compiler cache replays a link.
      # These entries therefore test non-LTO code generation. Which jobs still build with IPO,
      # and the one floating-point consequence already met, are on the `bench-ipo` job below.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TEST=ON
          -DLUMICE_IPO=OFF
          -DBUILD_GUI=${{ matrix.build_gui }}
          -DLUMICE_ISA_LEVEL=baseline
          ${{ env.LUMICE_PYTHON_ARGS }}
          ${{ env.LUMICE_COMPILER_LAUNCHER_ARGS }}

      - name: Build
        run: cmake --build build --parallel

      # Diagnostics, never a gate — hence the `|| true` on both calls. The hit rate is the one
      # number the step timestamps cannot supply: it is what tells a later reader whether a
      # slow Build was a cold cache or a real regression. Stopping the server afterwards
      # flushes its state to disk before actions/cache's post-step packs the directory; no
      # compilation happens after this point in the job.
      - name: ccache statistics (Ubuntu x86_64 / ARM64, macOS)
        if: always() && matrix.ccache
        run: ccache --show-stats --verbose || true

      - name: sccache statistics (Windows MSVC)
        if: always() && matrix.msvc
        shell: bash
        run: |
          sccache --show-stats || true
          sccache --stop-server || true

      - name: Test
        run: ctest --test-dir build --output-on-failure -L "unit-correctness|composition-correctness|parity|golden-analytic"

      # gui_unit_test is the first test target that only exists on some matrix entries (it is
      # inside `if(BUILD_GUI)`), which makes "green" and "ran" separable in a way they were not
      # before: --output-on-failure prints nothing on success, and `-L` selecting zero matching
      # tests is not an error, so a missing target, a mistyped LABEL or a binary that registered
      # no cases would all read as a pass. This step turns "it actually executed its 15 cases"
      # into an assertion instead of a log line somebody has to read. It re-runs one 7 ms binary.
      #
      # Update the expected count here when cases are migrated into gui_unit_test — a stale count
      # failing loudly is the intended behavior, not an accident.
      #
      # `shell: bash` for Windows too (the runner has Git Bash); GitHub runs bash steps with
      # `-eo pipefail`, so the `tee` does not mask ctest's own exit code.
      - name: Verify gui_unit_test actually ran (AC6 evidence)
        if: matrix.build_gui == 'ON'
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build -R LumiceGuiUnitTest -V | tee gui_unit_test_verify.log
          # What this gate is for: proving the target really EXECUTED its cases here, rather
          # than being silently skipped (not created, or the -R filter / ctest LABEL no longer
          # selecting it). It deliberately does not pin a case count. It used to demand exactly
          # "15 tests from 1 test suite", and every batch of cases migrated in from gui_test
          # then turned this leg red for a reason that had nothing to do with a defect — which
          # is how it came to sit stale and failing while the suite it guards was green.
          ran=$(sed -nE 's/.*\[==========\] ([0-9]+) tests? from [0-9]+ test suites? ran.*/\1/p' \
                gui_unit_test_verify.log | tail -1)
          if [ -z "$ran" ] || [ "$ran" -lt 1 ]; then
            echo "::error::gui_unit_test produced no gtest run summary — the target was not"
            echo "::error::created, or the ctest LABEL / -R filter no longer selects it."
            exit 1
          fi
          echo "gui_unit_test executed $ran case(s) on this platform."

      # The GUI visual-regression layer, actually executed. Until this step existed, gui_test was
      # built on three platforms and run on none, so a reference-image regression could only be
      # caught by whoever happened to run it locally — and the five merged PRs that did go red
      # this way were all released as "known flake" (doc/testing-architecture.md §4.6 has the
      # audit, the per-scene cross-platform PSNR measurements, and the disposition checklist a red
      # here obliges you to follow).
      #
      # Three deliberate choices, all argued in that section rather than restated here:
      #   - It runs inside the already-required `Ubuntu x86_64` leg, so it needs no new
      #     branch-protection context to block a merge.
      #   - It names its own filter instead of reusing scripts/build.sh's correctness pool. That
      #     pool is an EXCLUSION list for a machine with a real GPU; this is a POSITIVE list of
      #     the groups measured to survive a software rasterizer, so it is a different fact, not
      #     a second copy of one. Widening it is a measurement, not an edit.
      #   - It calls the binary rather than scripts/test.sh, whose gui layers deliberately
      #     self-skip when CI is set. Bending that would change behaviour for every other caller
      #     of the shared scripts to serve this one step.
      - name: GUI visual regression (Xvfb + Mesa llvmpipe)
        if: matrix.run_gui_visual == 'ON'
        shell: bash
        # The spike that qualified this step's two groups also found a timing-sensitive defect
        # in a third group under software rasterization (doc/testing-architecture.md §4.6,
        # "Why lens_proj is not in CI") — evidence that this layer can behave non-deterministically
        # under llvmpipe. A bounded timeout keeps a similar stall in a covered group from hanging
        # this required check indefinitely instead of failing loudly.
        timeout-minutes: 10
        run: |
          set -o pipefail
          rc=0
          # --keep-export-png / --export-dir are the same two flags scripts/regen_gui_test_refs.py
          # passes: the per-scene capture PNGs survive the comparison and land in a directory we
          # name, so the step below can upload them. They change nothing about the comparison
          # itself. The directory is created up front, as that driver does, rather than trusting
          # the binary to.
          mkdir -p gui_captures
          xvfb-run -a build/Release/static/bin/gui_test \
            --fixed-dt --filter "modal_layout,defaults_panel_layout" --no-user-config \
            --keep-export-png --export-dir "$GITHUB_WORKSPACE/gui_captures" \
            2>&1 | tee gui_visual.log || rc=$?
          # Same hazard, and the same answer, as the gui_unit_test verification above: a filter
          # that stops matching, a renamed category or a binary that registered no cases would
          # all exit 0 with nothing compared, and "green" would mean "never ran". Assert that
          # cases were executed, without pinning how many — a pinned count is a second thing to
          # keep correct, and it goes stale loudly for reasons unrelated to any defect.
          ran=$(sed -nE 's/.*\[GUI Tests\] [0-9]+\/([0-9]+) tests passed.*/\1/p' gui_visual.log | tail -1)
          if [ -z "$ran" ] || [ "$ran" -lt 1 ]; then
            echo "::error::gui_test compared no visual-regression scenes — the --filter no longer"
            echo "::error::selects any registered case, or the binary produced no run summary."
            exit 1
          fi
          echo "gui_test compared $ran visual-regression scene(s) against tracked references."
          exit $rc

      - name: Upload GUI visual-regression log
        if: always() && matrix.run_gui_visual == 'ON'
        uses: actions/upload-artifact@v7
        with:
          name: gui-visual-regression-log
          path: gui_visual.log
          retention-days: 30

      # The log above carries one PSNR per scene, and a PSNR is a single number over the whole
      # frame: it cannot tell a scene whose every glyph edge differs by one level of anti-aliasing
      # from one where a whole row of text has moved, and both read as "some dB below inf". This
      # runner is the only software-rasterizer (llvmpipe) sample the project has — the references
      # are shot on a developer machine, where these deterministic scenes compare pixel-identical —
      # so the pixels themselves are the only evidence of what cross-machine drift actually looks
      # like (how many pixels, how large a connected region, where in the frame). Any comparison
      # rule that has to tolerate this runner but not a real layout change has to be derived from
      # these captures, not from the log. Same condition, action and retention as the log: one
      # diagnostic family, one policy.
      # if-no-files-found: the directory is created up front by the run step, so an empty upload
      # would otherwise succeed silently — and an empty capture set is exactly the evidence loss
      # this artifact exists to prevent (a filter that matched nothing, a binary that never got as
      # far as a capture). Make that state red here rather than discover it when someone opens the
      # artifact.
      - name: Upload GUI visual-regression captures
        if: always() && matrix.run_gui_visual == 'ON'
        uses: actions/upload-artifact@v7
        with:
          name: gui-visual-regression-captures
          path: gui_captures
          if-no-files-found: error
          retention-days: 30

      - name: Upload GUI test binary (MSVC)
        if: matrix.msvc && matrix.build_gui == 'ON'
        uses: actions/upload-artifact@v7
        with:
          name: gui-test-windows-msvc
          path: |
            build/Release/static/bin/gui_test.exe
            build/Release/static/bin/LumiceGUI.exe
            build/Release/static/bin/Lumice.exe
          retention-days: 7

  # CUDA compile-only: nvcc actually compiles the .cu translation units on every
  # PR and every push to main. No GPU is required (nvcc emits PTX/object from CPU). Runtime and
  # parity validation still need a GPU runner and are intentionally
  # out of scope here — see issue.md AC6: this job must not be read as
  # "CUDA all green". The job exists to catch nvcc-only compile/syntax bugs
  # (e.g. -Werror=switch breaking nvcc, scrum-295 commit 9b9cdacd) without
  # waiting for the rsync→docker→GPU-host loop.
  #
  # It also configures with BUILD_TEST=ON so the CUDA-only test TUs are compiled
  # (rationale on the Configure step below). "Compile-only" still describes this
  # job exactly: the CUDA cases it builds all self-skip for want of a device.
  #
  # PTX floor = compute_61 (Pascal/2016+); driver JIT-compiles to native sm on
  # any GPU >= sm_61. Matches CMakeLists.txt CMAKE_CUDA_ARCHITECTURES default.
  cuda-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Install only the compiler + cudart dev headers/stubs (~400 MB) rather
      # than the full ~2 GB toolkit. This is enough for nvcc to compile .cu
      # files and for CMake's find_package(CUDAToolkit) / CUDA::cudart link
      # target to resolve. Pinned to CUDA 12.9 — the last 12.x minor, the same
      # toolkit both CUDA reference boxes (doc/machines.md) build and validate
      # with, and the first minor after 12.8 introduced sm_120, so the fatbin
      # gains native Blackwell SASS (CMakeLists.txt gates `120-real` on
      # toolkit >= 12.8). apt resolves the newest 12.9 patch on its own. Stay
      # on the 12 major: CUDA 13 drops compute_61, our PTX floor. Expect one
      # compute_61 deprecation warning from nvcc (accepted, see CMakeLists.txt).
      - name: Install CUDA toolkit (nvcc + cudart)
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb \
            -O cuda-keyring.deb
          sudo dpkg -i cuda-keyring.deb
          ls -la /etc/apt/sources.list.d/ || true
          sudo grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f
          grep -rn 'dl\.google\.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null || echo 'google source gone'
          sudo apt-get update -qq
          sudo apt-get install -y cuda-nvcc-12-9 cuda-cudart-dev-12-9
          echo "/usr/local/cuda/bin" >> $GITHUB_PATH

      # Share the CPM cache with the Ubuntu x64 build job: same OS, same
      # CMakeLists.txt hash → same dependency set. The CUDA-enabled configure
      # does not pull in new CPM packages (CUDA toolkit is system-installed
      # above, not via CPM), so cache hit rate is preserved.
      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: cpm_cache
          key: cpm-ubuntu-x64-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: cpm-ubuntu-x64-

      # ccache, including for nvcc (CMAKE_CUDA_COMPILER_LAUNCHER below): ccache 4.x caches
      # nvcc invocations like any other compiler, and a warm run measured 212/212 direct hits
      # with cuda_trace_backend.cu among them, Build 555 s -> 12 s. IPO was never this job's
      # cost (turning it off alone moved nothing): the time is compilation, nvcc's above all.
      #
      # CCACHE_MAXSIZE 200M against a measured directory of ~30 MB. Own key namespace, with
      # the discriminator before the platform for the reason given on the build job's ccache
      # key.
      - name: Install ccache
        run: |
          sudo apt-get install -y ccache
          ccache --version
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/ccache_cache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=200M" >> $GITHUB_ENV

      - name: Cache ccache directory
        uses: actions/cache@v6
        with:
          path: ccache_cache
          key: ccache-cuda-ubuntu-x64-${{ github.sha }}
          restore-keys: ccache-cuda-ubuntu-x64-

      - name: Zero ccache statistics
        run: ccache -z

      # BUILD_GUI=OFF avoids OpenGL/X11 deps. LUMICE_ISA_LEVEL=baseline matches the
      # rest of CI. LUMICE_IPO=OFF as on the build job: this job compiles and links, it
      # ships nothing, so the full-program link is cost with no signal.
      #
      # BUILD_TEST=ON, not OFF, and the reason is not "more coverage is nicer".
      # No .cu file lives under test/, so this job's older comment concluded its
      # coverage was already complete — but five test TUs there are wrapped in
      # `#if defined(LUMICE_CUDA_ENABLED)`
      # (test/{unit-correctness,parity-cross-backend}/backend/test_cuda_*.cpp),
      # and that macro comes from lumice_obj, which the four build-matrix jobs
      # never enable. CUDA=ON and BUILD_TEST=ON had therefore never been set
      # together on ANY platform: both halves existed, the intersection was
      # empty, and those five files compiled to nothing everywhere in CI. The
      # cost was paid twice — three MSVC incompatibilities that sat unreported
      # for three weeks, and two ctest wrappers that were never registered
      # because the build jobs have no pytest.
      #
      # BUILD_GUI stays OFF and does not weaken this: the five TUs belong to
      # unit_correctness_test and parity_test, which link lumice_obj only, while
      # gui_unit_test / composition_correctness_test / gui_test sit inside
      # `if(BUILD_GUI)` in test/CMakeLists.txt and are not defined here at all.
      - name: Configure (CUDA compile-only)
        env:
          CUDA_PATH: /usr/local/cuda
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TEST=ON
          -DLUMICE_IPO=OFF
          -DBUILD_GUI=OFF
          -DLUMICE_CUDA_ENABLED=ON
          -DLUMICE_ISA_LEVEL=baseline
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache

      # Builds the Lumice CLI plus the test binaries; this drives nvcc through
      # cuda_trace_backend.cu and links CUDA::cudart, exercising both compile and
      # link paths, and host-compiles the five CUDA test TUs with the macro on.
      # A cache hit replays nvcc's recorded diagnostics too, so its warnings still appear.
      - name: Build (compiles cuda_trace_backend.cu + the CUDA test TUs)
        run: cmake --build build --parallel

      # Diagnostics, never a gate: the hit rate separates a cold cache from a regression.
      - name: ccache statistics
        if: always()
        run: ccache --show-stats --verbose || true

      # Compile coverage only — every case is expected to report SKIPPED, since no GPU is
      # attached. This step exists to prove the CUDA TUs are non-empty and that their skip
      # guard works; it does NOT give this job runtime or parity coverage, which still runs
      # on the reference machines. GTEST_FILTER keeps it to ~26 cases instead of the ~1100
      # the two binaries hold, so it costs seconds and does not duplicate the build-matrix
      # jobs' full ctest.
      - name: Verify CUDA test TUs compile in and self-skip (SKIPPED expected, not a GPU check)
        shell: bash
        run: ./scripts/ci_verify_cuda_test_tus.sh build "$CUDA_TU_GTEST_FILTER"

  # Windows CUDA compile-only: nvcc + MSVC on windows-2022.
  #
  # Pin rationale (scrum-310 / task-win-cuda-ci-gate, 2026-07-01):
  #   - Runner: `windows-2022` (GitHub-hosted; CUDA Toolkit NOT preinstalled).
  #     We pin to windows-2022 ON PURPOSE — NOT the newer `windows-2025`. The
  #     `windows-2025` image has rolled its ONLY Visual Studio install forward
  #     to VS 2026 (MSVC 14.51, `_MSC_VER` 1951; `vswhere` finds only
  #     `...\Microsoft Visual Studio\18\Enterprise`, no VS 2022 fallback).
  #     Every current CUDA release rejects MSVC > VS 2022 (CUDA 12.9's
  #     `crt/host_config.h` line 168: `#error` when `_MSC_VER >= 1950`, "Only
  #     the versions between 2017 and 2022 (inclusive) are supported"; 12.6
  #     said the same), so the CUDA job MUST run on an image that still ships a
  #     CUDA-compatible MSVC. windows-2022 ships VS 2022 (MSVC 14.4x).
  #     Verified first-hand in CI run 28439410508 (the windows-2025 attempt
  #     that failed at Configure).
  #     Both Windows jobs pin windows-2022 today, for two DIFFERENT reasons
  #     that have to be maintained apart: this one because CUDA hard-rejects
  #     MSVC newer than VS 2022; the non-CUDA `Windows MSVC x86_64` build job
  #     above because release.yml's windows-x64 artifact builds there, and a
  #     build leg on another image tests a configuration nobody ships (the
  #     comment on that matrix entry carries the history).
  #   - MSVC: windows-2022 runner default (VS 2022; `_MSC_VER` surfaced by the
  #     "Diagnose toolchain versions" step below — kept permanently so future
  #     image drift is debuggable from any run).
  #   - CUDA: 12.9.2 — latest 12.x patch (12.9 is the last 12.x minor; 12.9.2
  #     ships the same nvcc 12.9.86 / cudart 12.9.79 as 12.9.1, the version
  #     the CUDA reference boxes in doc/machines.md validated compute_61 on),
  #     matches the Linux `cuda-compile` job above (one CUDA major across all
  #     CI legs) and supports VS 2022.
  #     Do NOT use CUDA 11.x — its `_MSC_VER` ceiling (~1930) is below recent
  #     VS 2022 17.x (scrum-309 hit exactly this).
  #   - WHY THE CUDA MAJOR IS 12, and why that fixes the other two pins: the
  #     chain starts at `compute_61`. The owner keeps the Pascal PTX floor
  #     (CMakeLists.txt `61-virtual`); CUDA 13 removed compute_61, so the
  #     major stays at 12. CUDA 12.x's `crt/host_config.h` accepts host MSVC
  #     up to VS 2022, so the runner must be an image that still ships VS
  #     2022 — `windows-2022`. Break the first link (drop compute_61) and the
  #     other two are free to move; until then they are consequences, not
  #     independent choices.
  #     The CUDA toolkit VERSION itself is written in three places that move
  #     as one: this job's `cuda:` input, release.yml's windows-x64 `cuda:`
  #     input, and the Linux `cuda-compile` job's apt package suffix
  #     (`cuda-nvcc-12-9` / `cuda-cudart-dev-12-9`). A repo variable was
  #     considered and not adopted: the apt suffix is `12-9` not `12.9.2`, so
  #     one value could not feed all three without derivation logic, and a
  #     drift between them fails loudly at install time rather than silently.
  #   - MAINTENANCE: when GitHub eventually retires windows-2022, either move
  #     to whatever hosted image still carries a CUDA-supported VS, or bump
  #     CUDA to a version that supports the then-current MSVC. Do NOT "fix" a
  #     future break by pinning a stale MSVC toolset onto windows-2025 — that
  #     image dropped VS 2022 entirely. THREE pins (VS 2022 / windows-2022 /
  #     CUDA major 12) move together or the build-mirrors-release property
  #     breaks again, across three places: this job, the
  #     `Windows MSVC x86_64` matrix entry above, and release.yml's
  #     windows-x64 row.
  #
  # Mirrors the ubuntu-24.04 `cuda-compile` job (compile-only, no GPU, no
  # runtime). Runtime/parity validation still requires a real CUDA GPU and
  # is covered by scrum-309 + the manual-release-artifact-verify task.
  #
  # This job is the merge gate for `feat/cuda-windows-validation` → main:
  # without it, the scrum-309 Windows-gated build fixes (spdlog/fmt/nvcc)
  # would have zero automated regression protection on main.
  #
  # No job-level `if:` — relies on the workflow-level `on: push: branches: [main]`
  # / `pull_request` triggers, so this gate runs once per PR and once per push to
  # main.
  windows-cuda-compile:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Sets up the MSVC environment (cl.exe, link.exe, lib paths) for the
      # current shell. Must run BEFORE the CUDA toolkit step so nvcc sees a
      # host compiler.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        # toolset: '14.39'  # Uncomment + pin if a future MSVC bump breaks the
        #                   # chosen CUDA version (scrum-309 used 14.39).

      # Diagnostics — kept permanently (not a throwaway spike). The host
      # compiler version determines which CUDA versions are usable; surfacing
      # `_MSC_VER` and `cl.exe` in every run means future "broke after image
      # update" failures are debuggable from the job log alone.
      - name: Diagnose toolchain versions
        shell: pwsh
        run: |
          Write-Host "=== MSVC environment ==="
          Write-Host "VCToolsVersion = $env:VCToolsVersion"
          Write-Host "VisualStudioVersion = $env:VisualStudioVersion"
          Write-Host "--- cl.exe banner ---"
          cl.exe 2>&1 | Select-Object -First 2
          Write-Host "--- _MSC_VER via test compile ---"
          # Emit _MSC_VER as a preprocessor token so it shows up verbatim in
          # the log even if cl.exe banner format changes across VS updates.
          'int main(){return _MSC_VER;}' | Set-Content -Path msc_probe.cpp
          cl.exe /nologo /EP /Zs msc_probe.cpp 2>&1 | Select-String 'return'
          Remove-Item msc_probe.cpp -ErrorAction SilentlyContinue

      # Install only nvcc + cudart dev headers/stubs (mirrors the Linux job's
      # precision install). `method: network` is appropriate for hosted runners
      # (fresh VM each run). `sub-packages` is Jimver/cuda-toolkit's documented
      # mechanism for partial installs — if the action ever changes that
      # contract, the install-size diagnostic step below will catch it.
      - name: Install CUDA toolkit (nvcc + cudart_dev)
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.9.2'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'

      # Verify sub-packages took effect (caught a full 4GB install rather than
      # the ~500MB nvcc+cudart subset). If this shows full-toolkit footprint,
      # the sub-packages contract changed and the install step needs revisit.
      - name: Diagnose CUDA install
        shell: pwsh
        run: |
          Write-Host "=== nvcc version ==="
          nvcc --version
          Write-Host "=== CUDA_PATH ==="
          Write-Host "CUDA_PATH = $env:CUDA_PATH"
          if ($env:CUDA_PATH) {
            Write-Host "--- toolkit footprint (top-level dirs) ---"
            Get-ChildItem $env:CUDA_PATH | Select-Object Name, Mode
          }

      # Independent cache key (not shared with the `windows-msvc-x64` build job
      # above) so an eventual divergence in CPM dependency sets between the
      # CUDA-enabled and CUDA-disabled configures cannot pollute either side.
      # Current CMakeLists.txt does not add CPM packages under
      # LUMICE_CUDA_ENABLED=ON, so this only costs one extra cache slot.
      #
      # The discriminator sits BEFORE the platform, not after it. `restore-keys`
      # is a prefix match, so the older `cpm-windows-msvc-x64-cuda-` spelling was
      # a *sub*namespace of the build job's `cpm-windows-msvc-x64-`: on any
      # exact-key miss that job could fall back onto this 2.7 MB CUDA entry
      # instead of its own ~175 MB one, silently re-downloading every dependency
      # while the log still reads "Cache restored from key". Nothing about that
      # failure is visible as a red — see the sibling comments on the two
      # ubuntu-x64 sub-jobs below, which had the same shape.
      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: cpm_cache
          key: cpm-cuda-windows-msvc-x64-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: cpm-cuda-windows-msvc-x64-

      # sccache for cl.exe and nvcc alike — the Linux job's ccache, in the tool the Windows
      # build leg already uses. Key namespace led by `cuda`, so it is not a prefix-subset of the
      # build leg's `sccache-windows-msvc-x64-`.
      - name: Install sccache
        uses: ./.github/actions/install-sccache
        with:
          cache-size: 800M

      - name: Cache sccache directory
        uses: actions/cache@v6
        with:
          path: sccache_cache
          key: sccache-cuda-windows-msvc-x64-${{ github.sha }}
          restore-keys: sccache-cuda-windows-msvc-x64-

      # BUILD_GUI=OFF + BUILD_TEST=ON mirrors the Linux cuda-compile job: no
      # GLAD2/Python generator is invoked (that step is gated on
      # matrix.build_gui == 'ON' in the build job above), and the five
      # `#if defined(LUMICE_CUDA_ENABLED)` test TUs get compiled instead of
      # collapsing to nothing. See the Linux job's Configure comment for why
      # BUILD_TEST=OFF was the wrong reading of "no .cu file lives under test/".
      #
      # This leg is the one that matters most for that gap: the historical
      # escapes it would have caught were MSVC-only source incompatibilities
      # (POSIX setenv/unsetenv, M_PI) in test code, which no other job compiles
      # with CUDA on. LUMICE_ISA_LEVEL=baseline matches the rest of CI; LUMICE_IPO=OFF for the
      # reason on the Linux job.
      - name: Configure (CUDA compile-only)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TEST=ON
          -DLUMICE_IPO=OFF
          -DBUILD_GUI=OFF
          -DLUMICE_CUDA_ENABLED=ON
          -DLUMICE_ISA_LEVEL=baseline
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_CUDA_COMPILER_LAUNCHER=sccache

      # Build the Lumice CLI plus the test binaries; this drives nvcc through
      # cuda_trace_backend.cu and links CUDA::cudart, exercising both compile and
      # link paths under MSVC, and compiles the CUDA test TUs through cl.exe.
      # This step's log must show nvcc invocation for the .cu TU.
      - name: Build (compiles cuda_trace_backend.cu via nvcc + the CUDA test TUs)
        run: cmake --build build --parallel

      # Diagnostics, never a gate. Stopping the server flushes its state before actions/cache's
      # post-step packs the directory.
      - name: sccache statistics
        if: always()
        shell: bash
        run: |
          sccache --show-stats || true
          sccache --stop-server || true

      # Same gate as the Linux job, same script, same expectation: every selected case
      # SKIPPED because windows-2022 hosted runners have no GPU. `shell: bash` is deliberate —
      # it lets both jobs share one implementation rather than maintaining a pwsh twin.
      - name: Verify CUDA test TUs compile in and self-skip (SKIPPED expected, not a GPU check)
        shell: bash
        run: ./scripts/ci_verify_cuda_test_tus.sh build "$CUDA_TU_GTEST_FILTER"

  # Bench compile-only: builds the `lumice_bench` target so BUILD_BENCH=ON cannot
  # rot again. It does NOT run the benchmarks — numbers off a shared, throttled
  # CI runner are noise, and running them would only add PR latency. Perf work
  # measures on the dedicated machines instead (doc/performance-testing.md).
  #
  # Why this job exists (2026-07-16): neither CI nor
  # the pre-commit hook passed -b / -DBUILD_BENCH=ON, so nothing ever compiled
  # bench/ and it silently rotted for months — e7c30933's RaySeg SBO refactor
  # left bench_filter.cpp referencing a member that no longer existed, and the
  # break surfaced only when someone tried -b by hand. Fixing the file without
  # adding this gate would just restart that clock.
  #
  # No job-level `if:` — relies on the workflow-level `on: push: branches: [main]`
  # / `pull_request` triggers, so this gate runs once per PR and once per push to
  # main.
  bench-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Independent cache key: BUILD_BENCH=ON pulls in the google/benchmark CPM
      # package, so this configure's dependency set differs from the plain
      # ubuntu-x64 build job's. Sharing a key would let one pollute the other.
      #
      # "Independent" has to be spelled with the discriminator in FRONT of the
      # platform. `restore-keys` matches by prefix, so `cpm-ubuntu-x64-bench-`
      # was not a sibling of the build job's `cpm-ubuntu-x64-` but a subset of
      # it, and the pollution the comment above rules out was reachable in the
      # one direction that matters: this job's configure is the narrow one
      # (BUILD_TEST=OFF, BUILD_GUI=OFF), so its entry is ~2.2 MB against the
      # build job's ~171 MB. The direction that breaks is therefore the build
      # job's, not this one's: its `cpm-ubuntu-x64-` fallback would land on this
      # job's narrow entry, restore an almost-empty cpm_cache and re-download
      # everything, reporting a hit the whole time. (This job's own restore-keys
      # were never the problem — they have always been the narrower prefix.)
      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: cpm_cache
          key: cpm-bench-ubuntu-x64-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: cpm-bench-ubuntu-x64-

      # BUILD_TEST=OFF + BUILD_GUI=OFF keep this job narrow: the build job above
      # already covers those targets, and skipping them avoids the OpenGL/X11
      # deps and the GLAD2 Python generator. LUMICE_ISA_LEVEL=baseline matches the
      # rest of CI.
      - name: Configure (bench compile-only)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TEST=OFF
          -DBUILD_GUI=OFF
          -DBUILD_BENCH=ON
          -DLUMICE_ISA_LEVEL=baseline

      # Target-scoped on purpose: `lumice_bench` pulls in lumice_obj, so this
      # compiles every bench translation unit plus the core it links against,
      # without building the CLI/install artifacts the build job already covers.
      - name: Build lumice_bench (compile + link only, no run)
        run: cmake --build build --target lumice_bench --parallel

  # x86-64-v4 compile-only. The Linux release ships a second, AVX-512 build of the engine
  # (release.yml, linux-x64 row: two configures at LUMICE_ISA_LEVEL=baseline and =x86-64-v4,
  # the second engine .so laid out under lib/glibc-hwcaps/x86-64-v4/ for the loader to pick).
  # Every other job here builds at baseline, so without this leg the -march=x86-64-v4
  # codegen path is first compiled on the day a tag is cut.
  #
  # Compile only, and BUILD_TEST=OFF — unlike cuda-compile, which turns tests ON. The CUDA
  # cases self-skip for want of a device; an AVX-512 binary has no such graceful path. A
  # GH-hosted runner may or may not have AVX-512, so running anything built here is a coin
  # toss between "passes" and SIGILL, and neither outcome would say anything about the
  # code. This job's claim stops at "GCC accepts -march=x86-64-v4 and the whole graph
  # compiles". BUILD_GUI=OFF because the GUI shares lumice_obj with the CLI: whatever v4
  # breaks, the CLI target already compiles it, and the GUI would only add its apt deps.
  #
  # Own cache discriminator, for the reason spelled out on bench-compile above: this
  # configure's dependency set is the narrow one, and a shared `cpm-ubuntu-x64-` prefix
  # would let the build job's fallback restore onto this job's small entry.
  #
  # No job-level `if:` — relies on the workflow-level `on: push: branches: [main]`
  # / `pull_request` triggers, so this gate runs once per PR and once per push to
  # main.
  isa-v4-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: cpm_cache
          key: cpm-isa-v4-ubuntu-x64-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: cpm-isa-v4-ubuntu-x64-

      - name: Configure (x86-64-v4 compile-only)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TEST=OFF
          -DBUILD_GUI=OFF
          -DLUMICE_ISA_LEVEL=x86-64-v4

      # The whole default graph, which with BUILD_TEST=OFF and BUILD_GUI=OFF is the CLI: lumice_obj
      # compiled at v4 and linked into it. (There is no launcher target any more — the Linux
      # release's dispatch is glibc's hwcaps lookup, with no code of ours to compile.)
      - name: Build (compile + link only, no run)
        run: cmake --build build --parallel

  # x86-64-v3 under clang-cl, with CUDA on. The Windows release ships a second build of the
  # engine compiled by clang-cl at -march=x86-64-v3 (release.yml, windows-x64 row: two
  # configures, baseline on cl.exe and x86-64-v3 on clang-cl, shipped as two engine DLLs the
  # shell picks between by CPUID at start-up).
  # No other job here uses clang-cl at all, so without this leg the clang-cl (C/C++) x nvcc
  # (.cu, cl.exe host) mixed compile — the one thing the Windows split gambles on that the Linux
  # split did not — is first exercised on the day a tag is cut.
  #
  # Unlike isa-v4-compile this job also RUNS the binary, once, for `benchmark`: v3 is AVX2,
  # which every hosted x64 runner has, so there is no SIGILL coin toss, and the assertion it
  # buys is the regression this whole path once had — CMake reports MSVC=TRUE for clang-cl,
  # and a macro gated on if(MSVC) alone left every clang-cl build reporting "baseline" while
  # -march was in fact applied. A green compile cannot see that; the isa key can.
  # BUILD_TEST=OFF keeps the claim narrow (does the mixed toolchain build the engine, and does
  # the tier reach the binary); BUILD_GUI=OFF for the reason isa-v4-compile gives.
  #
  # Own cache discriminator, before the platform name, for the reason spelled out on
  # windows-cuda-compile above. The LLVM pin mirrors release.yml's — a compile gate for a
  # toolchain the release does not use would be checking the wrong thing.
  #
  # No job-level `if:` — relies on the workflow-level `on: push: branches: [main]`
  # / `pull_request` triggers, so this gate runs once per PR and once per push to
  # main.
  windows-isa-v3-compile:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Before the CUDA step, as on windows-cuda-compile: nvcc needs cl.exe on PATH as its
      # host compiler, and so does this job's .cu translation unit even though every other
      # TU goes through clang-cl.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # Not put on PATH, same as release.yml: the compiler is named by full path below, so
      # nothing else in this job can pick LLVM up by accident.
      - name: Install clang-cl (LLVM, pinned)
        shell: pwsh
        run: |
          choco install llvm --version=20.1.0 -y --no-progress --allow-downgrade
          & "C:\Program Files\LLVM\bin\clang-cl.exe" --version

      - name: Install CUDA toolkit (nvcc + cudart_dev)
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.9.2'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'

      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: cpm_cache
          key: cpm-isa-v3-windows-x64-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: cpm-isa-v3-windows-x64-

      - name: Configure (x86-64-v3, clang-cl + nvcc/cl.exe, compile-only)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TEST=OFF
          -DBUILD_GUI=OFF
          -DLUMICE_ISA_LEVEL=x86-64-v3
          -DLUMICE_CUDA_ENABLED=ON
          -DCMAKE_CXX_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe"
          -DCMAKE_C_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe"
          -DCMAKE_CUDA_HOST_COMPILER=cl

      # The whole default graph: the CLI (lumice_obj at v3 under clang-cl, the .cu TU under
      # nvcc + cl.exe, linked by lld-link). This is the static flavor, so the shell's delay-load
      # hook (src/launcher/win_engine_loader.c, shared flavor only) is not part of it.
      - name: Build (compile + link only)
        run: cmake --build build --parallel

      # The one run this job makes. The output directory is the top-level CMakeLists.txt's
      # CMAKE_RUNTIME_OUTPUT_DIRECTORY (anchored on the source dir, not on -B). Runs the
      # legacy CPU backend: the CUDA-linked binary starts without a GPU (cudart is on PATH
      # from the toolkit step, the device probe finds nothing and routes to CPU), which is
      # the same thing windows-cuda-compile's test binaries already rely on.
      - name: Assert the isa key reports x86-64-v3 under clang-cl
        shell: pwsh
        run: |
          $out = & "build\Release\static\bin\Lumice.exe" benchmark -f examples\bench_config.json 2>&1 | Out-String
          if ($out -notmatch '"isa"\s*:\s*"x86-64-v3"') {
            Write-Error "isa key did not report x86-64-v3 under clang-cl; output:`n$out"
            exit 1
          }
          Write-Host "isa key reports x86-64-v3 (clang-cl, -march applied)."

  # Shared + tests + GUI compile-only: the one combination no other job builds.
  # The `build` job builds tests and the GUI but only statically; `e2e-slow` is the
  # only shared-library job and it passes -DBUILD_TEST=OFF -DBUILD_GUI=OFF. That gap
  # let a real link-structure defect sit undetected: gui_test reached core through
  # lumice_gui_obj, and because a CMake OBJECT library does not forward another OBJECT
  # library's object files, under BUILD_SHARED_LIBS=ON it resolved against the `lumice`
  # dylib, which exports only the LUMICE_* C API — so the white-box GUI tests could not
  # link at all. Nothing was red, because nothing ever built it.
  #
  # Build-only on purpose: CI runners have no display server, so running gui_test here
  # would mostly exercise LUMICE_SKIP_GUI_TESTS=1 skips. This job's value is link-time
  # correctness, which is exactly the defect class above. Runtime behavior under the
  # shared flavor is verified locally, not here.
  #
  # No job-level `if:` — relies on the workflow-level `on: push: branches: [main]`
  # / `pull_request` triggers, so this gate runs once per PR and once per push to
  # main.
  shared-gui-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Drop the unused vendor source first — see the comment on the build job's
      # "Install Linux GUI dependencies" step for why one broken third-party index fails
      # the whole `apt-get update`.
      - name: Install Linux GUI dependencies
        run: |
          ls -la /etc/apt/sources.list.d/ || true
          sudo grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f
          grep -rn 'dl\.google\.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null || echo 'google source gone'
          sudo apt-get update
          sudo apt-get install -y \
            libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgtk-3-dev

      # Independent cache key: BUILD_SHARED_LIBS=ON is a distinct configure, so its
      # dependency set may differ from the plain ubuntu-x64 build job's. Sharing a key
      # would let one pollute the other. The discriminator leads the platform for the
      # same reason as the bench job above: under the older
      # `cpm-ubuntu-x64-shared-gui-test-` spelling this namespace was a prefix-subset
      # of `cpm-ubuntu-x64-`, so "independent" held in name only.
      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: cpm_cache
          key: cpm-sharedgui-ubuntu-x64-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: cpm-sharedgui-ubuntu-x64-

      # ccache on this leg, as on the build job's non-Windows entries — both are compile-bound
      # Linux legs, and each cap is sized from its own leg's measurement, never copied from a
      # neighbour's.
      #
      # CCACHE_MAXSIZE is 800M. It used to be 200M, sized from a 37 MB cold directory measured
      # when this configure still built with IPO (GCC's LTO objects are IR, not machine code —
      # the likely reason for the gap). Once IPO was off one cold compile left 0.3 GB, so 200M
      # could not hold even a single generation: the cap sat at 100.1% with ~25k cleanups a run
      # and a 17% hit rate, and it read as a slow leg, not a red. At 800M the same directory
      # measured 42% of the cap and the warm Build fell from 681 s to 7-17 s.
      #
      # A cap is not a footprint (doc/testing-architecture.md §7.1): the quota is charged by
      # what is stored, so compare legs by their measured directories, not by their caps.
      #
      # If `ccache --show-stats` ever reports Cache size at Max cache size, the cap is
      # evicting live objects and has to go up. That shows up as a quietly lower hit rate and
      # an unchanged-looking build, never as a red, so read the number rather than the wall
      # clock.
      - name: Install ccache
        run: |
          sudo apt-get install -y ccache
          ccache --version
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/ccache_cache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=800M" >> $GITHUB_ENV

      # Same key shape as the sccache entry: one per commit, with a prefix fallback to the
      # newest earlier one. The discriminator leads the platform for the reason spelled out
      # on the cpm keys — `ccache-ubuntu-x64-...` would become a prefix-subset the moment the
      # plain ubuntu-x64 leg ever gets a cache of its own.
      - name: Cache ccache directory
        uses: actions/cache@v6
        with:
          path: ccache_cache
          key: ccache-sharedgui-ubuntu-x64-${{ github.sha }}
          restore-keys: ccache-sharedgui-ubuntu-x64-

      - name: Zero ccache statistics
        run: ccache -z

      # The launcher flags are written out here rather than injected through an environment
      # variable: this job has exactly one Configure step, so the indirection the build job
      # needs (one step serving four matrix entries) would buy nothing here. LUMICE_IPO=OFF:
      # this leg's value is link structure, which IPO does not change, and the shared GCC LTO
      # link it used to carry is still built on E2E Slow's Ubuntu entry.
      - name: Configure (shared + test + GUI)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TEST=ON
          -DLUMICE_IPO=OFF
          -DBUILD_GUI=ON
          -DBUILD_SHARED_LIBS=ON
          -DLUMICE_ISA_LEVEL=baseline
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build (compile + link only, no run)
        run: cmake --build build --parallel

      # Diagnostics, never a gate. The hit rate is what separates "the cache worked" from
      # "this runner was faster", which wall clock alone cannot do: identical work on this
      # provider was measured spanning 1.28x across runners while its link phase held to
      # within 6%.
      - name: ccache statistics
        if: always()
        run: ccache --show-stats --verbose || true

  e2e-test:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true  # E2E reference images are stored in LFS

      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: cpm_cache
          key: cpm-ubuntu-x64-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: cpm-ubuntu-x64-

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/cmake_install/static
          -DBUILD_TEST=OFF
          -DBUILD_GUI=OFF
          -DLUMICE_ISA_LEVEL=baseline

      - name: Build
        run: cmake --build build --parallel

      - name: Install
        run: cmake --install build

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        # numpy is imported at module top in several test modules and
        # test/e2e/capi_runner.py (BufferedSimResult dataclass), so pytest
        # collection needs it even when the slow tests themselves are skipped.
        run: pip install Pillow pytest numpy

      - name: Run E2E tests
        # `-m "not slow"` excludes shared-lib-based tests which require
        # BUILD_SHARED_LIBS=ON and a separate build flavor (see e2e-slow job).
        # Test paths come from pyproject.toml [tool.pytest.ini_options] testpaths.
        # `nproc` records this runner's actual core count once per run, so "how
        # many cores are idle" is measured instead of inferred (this pytest
        # invocation has no -n; whether to add one is a separate, not-yet-made
        # decision). `--durations=20` makes the slowest cases visible in the log —
        # see the timeout-minutes comment below for why that matters.
        # `-p duration_report_plugin --duration-report` writes every test's cost for
        # the "Check test durations" step below (doc/testing-architecture.md §7.7).
        run: |
          nproc
          PYTHONPATH=scripts pytest -v -m "not slow" --durations=20 \
            -p duration_report_plugin --duration-report="$RUNNER_TEMP/durations.json"
        # This is an owner-set BUDGET, not a hang detector (see doc/testing-architecture.md
        # §7): if the suite cannot fit in 10 minutes, that means the suite is too
        # large, not that the timeout should grow. On red here, read this step's
        # --durations=20 output first to decide what to trim or fix — do not just
        # rerun; see doc/testing-architecture.md §7 for the full disposition rule.
        timeout-minutes: 10

      - name: Check test durations
        # Runtime gate, not a diff check: every test over the threshold in this run
        # must be registered in test/duration_registry.json with a reason
        # (doc/testing-architecture.md §7.7). On red, the log names the test and
        # prints the registry line to add — or make the test faster instead.
        run: python3 scripts/check_test_durations.py --job "e2e-test" --report "$RUNNER_TEMP/durations.json"

  e2e-slow:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the metal slow tests for real (Apple-only) and the suite is
        # heavy, so it is split into two parallel legs (separate runners → no
        # core contention) to keep each leg's wall-clock under the step timeout
        # without bumping it high enough to drag overall PR latency. Ubuntu skips
        # all metal tests (Darwin guard) so it stays a single fast leg.
        #
        # HOW THE TWO macOS LEGS ARE BALANCED, and how to re-balance them. The
        # groupings below are the answer to one past measurement, not a constant:
        # every slow test added or removed shifts the load, so they go stale.
        #
        # Deriving them (repeat this when the legs drift apart):
        #   1. `gh run view <run-id> --log` on the "Run slow E2E tests" step of
        #      both macOS legs. Under `-v -n 3` every test prints a timestamped
        #      `[gwN] [ x%] PASSED <test id>` line as it finishes, and an xdist
        #      worker is serial internally, so the gap between two consecutive
        #      lines from the SAME worker approximates the later test's duration.
        #      Sum those per file. Job-level totals (`gh run view --json jobs`)
        #      are NOT a substitute — they carry no per-file breakdown to pack.
        #   2. Sort files by that cost descending and greedily place each one on
        #      whichever leg is cheaper so far (longest-processing-time bin
        #      packing). Replace BOTH lists with the result rather than patching
        #      one of them: which grouping is optimal changes wholesale.
        # WHEN to redo it. The trigger is NOT how far apart the two legs are.
        # A run's wall-clock is its longest job and nothing else, so evening the
        # legs out is only worth CI time while one of them IS that longest job.
        # Re-measured 2026-09-08 on one pull_request run, which now carries
        # every job (no job-level `if:` makes anything push-only any more):
        #   shared-gui-test-build     734s  <- longest, this sets the wall-clock
        #   E2E Slow (macOS parity)   556s
        #   Ubuntu x86_64             530s
        #   Windows MSVC x86_64       528s
        #   E2E Slow (macOS rest)     456s
        # STALE as of 2026-09-17 (PR #375/#376/main runs 35169897211 / 35170744547 /
        # 35196516286): "rest"'s phase 2 gained test_metal_dual_renderer_throughput
        # (#372) at 278-296s on this hardware, and phase 1 alone now swings 361-552s
        # depending on runner day, so the leg's total is 660-850s — its OWN trigger
        # condition below ("either macOS leg becoming the longest job of a run") is now
        # plausibly met (850s > shared-gui-test-build's 734s), but re-measuring and
        # re-packing is deliberately NOT done here: that needs a fresh `gh run view
        # --log` per-file pass, which belongs to a separate follow-up.
        # The Windows leg used to hold the top of this list at 740s; sccache as
        # a compiler launcher moved it to 528-605s and the ceiling moved with
        # it. Both macOS legs still sit under the ceiling, so packing them
        # closer buys ZERO wall-clock — the ceiling is somewhere else. Trigger to
        # redo the packing: either macOS leg becoming the longest job of a run.
        # The ratio between the legs is a bad proxy for that and is recorded
        # here only as a fact, not as a target: this grouping measured 1.28x and
        # 1.53x on two runs of identical code (mean ~1.39x). A single run cannot
        # judge either number — the same leg has been seen to swing 10-30%.
        #
        # The parity leg used to carry a floor no repacking removed:
        # test_capi_sentinel_overflow, ONE indivisible case, pinned a worker
        # for ~204s while projection-parity's 12 cases (63-82s each) shared the
        # other two, landing the leg near 600s. Both fixtures were cut on
        # 2026-09-30 — the sentinel to 100k rays per lifecycle (36 lifecycles
        # kept), projection parity to 1M rays per case — and the same three
        # files measured ~61s of pytest and a 158s job on the trial run of
        # PR #449 (macOS runner, this grouping). That floor is gone; the job
        # numbers in this comment that predate 2026-09-30 describe the old
        # fixtures and are stale for this leg.
        #
        # ⛔ Bin packing alone is NOT sufficient, and getting this wrong turns a
        # leg RED, not merely slow. Two constraints sit on top of it:
        #   (a) A file's cost is a property of the file AND its co-tenants, not
        #       of the file. These tests saturate CPU/GPU, so moving one changes
        #       the measured cost of the others: across two groupings the same
        #       exit-seam file measured 594s and 749s, and projection-parity
        #       measured 979s and 596s. Re-derive costs after every regrouping;
        #       never carry a number across a regrouping.
        #   (b) The capi_runner-based scenes impose a per-scene wall-clock limit
        #       (`_TIMEOUT = 180` in the exit-seam and projection-parity tests,
        #       passed to run_scene_capi_buffered). Starve one of CPU and it does
        #       not run slower, it raises. Concretely: exit-seam parity and
        #       test_capi_sentinel_overflow must not share a leg — the latter is
        #       a single indivisible case that pins one worker for the whole run
        #       (376s while starved beside exit-seam, ~204s in the grouping that
        #       shipped), and pairing them made an exit-seam scene cross 180s.
        #       Those numbers are from its old 5M-rays-per-lifecycle budget; at
        #       today's 100k it ran ~10s, so this pairing rule's cause is likely
        #       gone, but no grouping was re-measured to retire it.
        # Practical rule when regrouping: keep the two heavyweight capi_runner
        # parity files (exit-seam, projection) on opposite legs, and keep
        # test_capi_sentinel_overflow off the exit-seam leg.
        #
        # Because of (a), converging takes more than one CI run: each grouping
        # has to be measured, and the measurement only describes that grouping.
        # The three groupings tried here, by job duration (rest / parity):
        #   sentinel+light | projection+batch_inv+color_mask   584 RED / 397
        #   light          | +sentinel                         385 / 595  (1.55x)
        #   +batch_inv     | projection+sentinel+color_mask     <- current,
        #                                            479 / 615 then 391 / 597
        # Expect to spend a couple of runs this way rather than one.
        #
        # Why the legs are expressed differently: the "rest" leg has to keep
        # picking up newly added test files on its own, so it names test ROOTS
        # and subtracts the files moved away (--ignore does apply to those, since
        # they are reached by recursing into a root — see the phase-1 comment in
        # the run step below for the case where --ignore does NOT apply). The
        # other leg names files explicitly, the only way to say "just these".
        # Consequence: a new slow test file lands on the "rest" leg by default.
        #
        # The `name:` fields are historical labels, not content classifications —
        # the leg called "parity" carries the three heaviest GPU files and the
        # "rest" leg carries the exit-seam parity test. They are left alone on
        # purpose: they are branch-protection required-check names, so renaming
        # them is a repository-settings change, not a workflow change.
        include:
          - name: Ubuntu x86_64
            os: ubuntu-24.04
            cache_key: ubuntu-x64
            pytest_args: "test/e2e-correctness test/parity-cross-backend test/performance test/gui test/regression-sentinel"

          - name: macOS ARM64 parity
            os: macos-15
            cache_key: macos-arm64
            pytest_args: "test/parity-cross-backend/backend/test_metal_projection_parity.py test/regression-sentinel/test_capi_sentinel_overflow.py test/regression-sentinel/test_gpu_color_mask_batch_leak.py"

          - name: macOS ARM64 rest
            os: macos-15
            cache_key: macos-arm64
            pytest_args: "test/e2e-correctness test/parity-cross-backend test/performance test/gui test/regression-sentinel --ignore=test/parity-cross-backend/backend/test_metal_projection_parity.py --ignore=test/regression-sentinel/test_capi_sentinel_overflow.py --ignore=test/regression-sentinel/test_gpu_color_mask_batch_leak.py"

    runs-on: ${{ matrix.os }}
    name: E2E Slow (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: cpm_cache
          key: cpm-${{ matrix.cache_key }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: cpm-${{ matrix.cache_key }}-

      - name: Configure (shared library)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TEST=OFF
          -DBUILD_GUI=OFF
          -DBUILD_SHARED_LIBS=ON
          -DLUMICE_ISA_LEVEL=baseline

      - name: Build
        run: cmake --build build --parallel

      # The analytic library's install rules and package config (root CMakeLists.txt,
      # doc/analytic-api.md section 8.4) run nowhere else in CI: the tests below read the build
      # tree. Installing the `analytic` component alone into a scratch prefix and checking the
      # files it must produce turns a broken install rule into a red leg rather than a silent
      # gap. Whether an outside project can then find_package and link it is the
      # external-consumer smoke test's question (test_external_consumer_smoke.py, run by the
      # "Run slow E2E tests" step below against this same prefix), not this step's.
      - name: Install analytic package (packaging smoke)
        run: |
          set -euo pipefail
          cmake --install build --component analytic --prefix "$RUNNER_TEMP/analytic-install"
          if [ "$RUNNER_OS" = "macOS" ]; then lib=lib/liblumice_analytic.dylib; else lib=lib/liblumice_analytic.so; fi
          for f in include/lumice_analytic.h include/lumice_analytic_core.h "$lib" \
                   lib/cmake/LumiceAnalytic/LumiceAnalyticConfig.cmake \
                   lib/cmake/LumiceAnalytic/LumiceAnalyticConfigVersion.cmake \
                   lib/cmake/LumiceAnalytic/LumiceAnalyticTargets.cmake; do
            test -f "$RUNNER_TEMP/analytic-install/$f" || { echo "::error::analytic install is missing $f"; exit 1; }
          done
          # The package's headers are exactly these two: no engine header (src/include/lumice_*.h)
          # ships with it, so a consumer cannot compile against both (doc/analytic-api.md section 2.6).
          headers="$(cd "$RUNNER_TEMP/analytic-install/include" && find . -type f | LC_ALL=C sort | tr '\n' ' ')"
          test "$headers" = "./lumice_analytic.h ./lumice_analytic_core.h " || { echo "::error::analytic install ships headers [$headers], expected exactly lumice_analytic.h and lumice_analytic_core.h"; exit 1; }
          find "$RUNNER_TEMP/analytic-install" -type f | sort

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install Pillow pytest numpy pytest-xdist

      - name: Run slow E2E tests
        # CLI-based Darwin slow gates (test_metal_throughput, test_metal_batch_invariance
        # exit-conservation) drive the `Lumice` CLI via runner.find_lumice_binary(), which
        # looks for build/cmake_install/static/Lumice or $LUMICE_BIN. This shared-lib build does
        # not install the CLI (the packaging step above installs only the analytic component,
        # into a scratch prefix), so point LUMICE_BIN at the build-tree binary (its build-tree rpath
        # resolves liblumice; DYLD/LD_LIBRARY_PATH set as a belt-and-suspenders fallback).
        # No-op on legs where the binary is absent. (The parity leg uses the shared lib via
        # capi_runner and is unaffected; the Ubuntu leg has no CLI-based slow tests.)
        run: |
          cli="$(find build -type f -name Lumice 2>/dev/null | head -1)"
          if [ -n "$cli" ]; then export LUMICE_BIN="$cli"; fi
          lib="$(find build \( -name 'liblumice*.dylib' -o -name 'liblumice*.so' \) 2>/dev/null | head -1)"
          if [ -n "$lib" ]; then
            libdir="$(dirname "$lib")"
            export DYLD_LIBRARY_PATH="$libdir:${DYLD_LIBRARY_PATH:-}"
            export LD_LIBRARY_PATH="$libdir:${LD_LIBRARY_PATH:-}"
          fi
          # The external-consumer smoke test (test_external_consumer_smoke.py) consumes the prefix the
          # packaging step above installed, rather than installing a second copy of its own.
          export LUMICE_ANALYTIC_INSTALL_DIR="$RUNNER_TEMP/analytic-install"
          # Phase 1 — parallel (pytest-xdist, -n 3). xdist runs each test in a
          # separate WORKER PROCESS, so capi_runner's process-global os.environ +
          # log callback stay per-process isolated (validated: the full slow suite
          # passes under -n 3, ~4min vs ~14min serial). Throughput gates are
          # EXCLUDED here — they must not measure under concurrent GPU load.
          #
          # That exclusion is done by dropping the token from the positional list,
          # NOT by --ignore: pytest applies --ignore only to paths it DISCOVERS by
          # recursing into a positional argument, never to a positional argument
          # itself. Legs that list `test/performance` positionally therefore kept
          # running the gates here under exactly the concurrent GPU load this
          # comment forbids (measured with --collect-only: 2 perf cases collected
          # in phase 1). The --ignore= flags already inside pytest_args stay — they
          # name files reached by recursion, which is the case --ignore does cover.
          phase1_args=""
          for arg in ${{ matrix.pytest_args }}; do
            if [ "$arg" != "test/performance" ]; then
              phase1_args="$phase1_args $arg"
            fi
          done
          # -p duration_report_plugin: see the "Check test durations" step below.
          export PYTHONPATH=scripts
          pytest $phase1_args -n 3 -v -m slow --durations=20 \
            -p duration_report_plugin --duration-report="$RUNNER_TEMP/durations-phase1.json"
          # Phase 2 — serial + GPU-isolated: the throughput gates run alone so the
          # measured rate is not deflated by concurrent tests. Only legs whose args
          # include test/performance run this (the leg named "parity" lists files
          # explicitly and has no perf tests → skipped). Cheap (~2 gates); no -n
          # on purpose.
          # --dual-gate-profile=ci: the dual-renderer gate here is the DISASTER
          # floor (0.75 over 5 reps), not the precise 0.85 over 21 — a hosted
          # runner's per-arm CoV (0.155-0.229) reads the precise number red with
          # nothing wrong. A red here is a red PR. The precise gate runs on the
          # reference machines on a schedule (doc/performance-testing.md,
          # "Precise throughput gate (local schedule)"); why the two numbers:
          # test/e2e/_multi_renderer_throughput.py. -rP keeps the gates' measured
          # ratio/CoV lines in the log when they pass, which pytest otherwise drops.
          case "${{ matrix.pytest_args }}" in
            *test/performance*) pytest test/performance -v -m slow --durations=20 -rP \
              --dual-gate-profile=ci \
              -p duration_report_plugin --duration-report="$RUNNER_TEMP/durations-phase2.json" ;;
          esac
        # 25, not the original 15: phase 1 alone measured 500-552s on a slow runner day
        # (vs. 361s on a fast day) and phase 2's Metal dual-renderer throughput gate
        # (test_metal_dual_renderer_throughput, added by #372) measured 278s on a
        # GitHub-hosted macOS runner — the 278s cost is real GPU-contention-on-shared-
        # hardware, not this leg being slow to start; see
        # test/performance/test_metal_multi_renderer_throughput.py's docstring for the
        # ~70s Metal-reference-machine number that does not apply here. Worst measured
        # sum is ~552 + 296 = 848s (~14.2min), so 25min leaves ~10min margin; 20 would
        # not survive a slow phase-1 day stacked on the phase-2 cost.
        # Those 278-296s were the precise profile (21 reps). Phase 2 now runs the ci
        # profile (5 reps): the gate measured 104s / 124s and phase 2 124s / 147s on runs
        # 36756401783 / 36758254351 (28-41s on the Metal reference machine), job totals
        # 811s / 830s. The timeout is left at 25; where it should go is a whole-leg call.
        timeout-minutes: 25

      - name: Check test durations
        # Same runtime gate as e2e-test's step of this name; phase 2 writes its
        # report only on legs that run it, so the second --report is conditional.
        run: |
          reports=(--report "$RUNNER_TEMP/durations-phase1.json")
          if [ -f "$RUNNER_TEMP/durations-phase2.json" ]; then
            reports+=(--report "$RUNNER_TEMP/durations-phase2.json")
          fi
          python3 scripts/check_test_durations.py --job "E2E Slow (${{ matrix.name }})" "${reports[@]}"

  # Windows shared-library export sets, under both Windows compilers the release uses (cl.exe
  # for the baseline engine, clang-cl for the v3 one). The three shared libraries — lumice,
  # lumice_testapi and the published lumice_analytic — are linked from the same engine objects
  # and differ only in their export lists (scripts/gen_export_list.py → a .def per library on
  # Windows). No other Windows leg builds the shared flavor, so without this job nothing would
  # check that a DLL exports exactly its header's functions rather than every engine symbol, or
  # that lumice_analytic is produced and loads on Windows at all. e2e-slow covers the same test
  # on Linux and macOS (its "rest" legs pick up test/e2e-correctness by directory).
  #
  # Narrow on purpose: configure + build + one pytest file that reads `dumpbin /exports` and
  # loads each DLL through ctypes. It needs nothing but pytest — no numpy/Pillow, no test/e2e
  # helpers — which is what keeps this from becoming a Windows e2e suite. Not CUDA (the
  # analytic library is produced only without it) and baseline ISA (what it ships at).
  #
  # No job-level `if:` — relies on the workflow-level `on: push: branches: [main]`
  # / `pull_request` triggers, so this gate runs once per PR and once per push to
  # main.
  windows-shared-export:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC
            cache_key: windows-shared-msvc
            compiler_args: ""
          - name: clang-cl
            cache_key: windows-shared-clangcl
            # Named by full path, not put on PATH — same as windows-isa-v3-compile and release.yml.
            compiler_args: >-
              -DCMAKE_CXX_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe"
              -DCMAKE_C_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe"
    runs-on: windows-2022
    timeout-minutes: 40
    name: Windows shared export (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7

      # Both legs: cl.exe / link.exe for the MSVC leg, and dumpbin.exe for the test on both.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # The LLVM pin mirrors windows-isa-v3-compile's and release.yml's.
      - name: Install clang-cl (LLVM, pinned)
        if: matrix.name == 'clang-cl'
        shell: pwsh
        run: |
          choco install llvm --version=20.1.0 -y --no-progress --allow-downgrade
          & "C:\Program Files\LLVM\bin\clang-cl.exe" --version

      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: cpm_cache
          key: cpm-${{ matrix.cache_key }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: cpm-${{ matrix.cache_key }}-

      # sccache for both compilers (it handles cl.exe and clang-cl alike). `windows-shared-msvc-`
      # and `windows-shared-clangcl-` are not prefixes of each other or of any other sccache key.
      - name: Install sccache
        uses: ./.github/actions/install-sccache
        with:
          cache-size: 800M

      - name: Cache sccache directory
        uses: actions/cache@v6
        with:
          path: sccache_cache
          key: sccache-${{ matrix.cache_key }}-${{ github.sha }}
          restore-keys: sccache-${{ matrix.cache_key }}-

      # BUILD_TEST=ON (unlike e2e-slow's shared legs) so unit_correctness_test — the one CMake
      # target that links lumice_obj directly rather than through the `lumice` DLL boundary
      # (test/CMakeLists.txt's target_link_libraries(unit_correctness_test PRIVATE ... lumice_obj))
      # — is actually compiled here. Without it, no CI leg ever built a lumice_obj-direct
      # consumer together with BUILD_SHARED_LIBS=ON on Windows, so a wrong
      # LUMICE_SHARED_DEFINE INTERFACE definition (this repo's CMakeLists.txt, `target_compile_
      # definitions(lumice INTERFACE LUMICE_SHARED_DEFINE)`) could leak dllimport into such a
      # consumer — which does not link the `lumice` import library — without any red CI to show
      # it (an LNK2001/LNK2019 that only a build reaching this exact combination would surface).
      #
      # No LUMICE_IPO=OFF here, unlike the build and cuda jobs. This job reads the export
      # tables of the DLLs it builds, and the clang-cl engine DLL the release ships is an LTO
      # build; an LTO build is exactly where an export table once came out empty while the
      # link "succeeded" (the cl.exe /GL history on the IPO block of CMakeLists.txt). Checking
      # a non-LTO DLL would check a binary nobody ships. (The MSVC entry builds without IPO
      # either way: cl.exe shared trees are excluded there.)
      - name: Configure (shared library, no CUDA)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TEST=ON
          -DBUILD_GUI=OFF
          -DBUILD_SHARED_LIBS=ON
          -DLUMICE_ISA_LEVEL=baseline
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          ${{ matrix.compiler_args }}

      # Named targets, not a plain `--parallel` build of everything BUILD_TEST=ON now pulls in:
      # parity_test / golden_analytic_test don't need to be part of this leg (they carry no
      # lumice_obj-direct-under-shared-config risk beyond what unit_correctness_test already
      # covers), so building them here would only add Windows CI time for no new signal.
      - name: Build
        run: cmake --build build --target Lumice --target lumice_testapi --target lumice_analytic --target unit_correctness_test --parallel

      - name: sccache statistics
        if: always()
        shell: bash
        run: |
          sccache --show-stats || true
          sccache --stop-server || true

      # Same packaging smoke as e2e-slow's, for the DLL + import library layout (bin/ + lib/).
      # `--component analytic` matters here: this leg builds named targets only, and a plain
      # install would also run the install rules of targets it never built.
      - name: Install analytic package (packaging smoke)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path $env:RUNNER_TEMP 'analytic-install'
          cmake --install build --component analytic --prefix $prefix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = @('include/lumice_analytic.h', 'include/lumice_analytic_core.h',
                        'bin/lumice_analytic.dll', 'lib/lumice_analytic.lib',
                        'lib/cmake/LumiceAnalytic/LumiceAnalyticConfig.cmake',
                        'lib/cmake/LumiceAnalytic/LumiceAnalyticConfigVersion.cmake',
                        'lib/cmake/LumiceAnalytic/LumiceAnalyticTargets.cmake')
          foreach ($f in $expected) {
            if (-not (Test-Path (Join-Path $prefix $f) -PathType Leaf)) {
              Write-Output "::error::analytic install is missing $f"
              exit 1
            }
          }
          # The package's headers are exactly these two: no engine header (src/include/lumice_*.h)
          # ships with it (doc/analytic-api.md section 2.6).
          $names = @(Get-ChildItem -Recurse -File (Join-Path $prefix 'include') | ForEach-Object { $_.Name })
          $headers = $names -join ' '
          if ($names.Count -ne 2 -or $names -notcontains 'lumice_analytic.h' -or $names -notcontains 'lumice_analytic_core.h') {
            Write-Output "::error::analytic install ships headers [$headers], expected exactly lumice_analytic.h and lumice_analytic_core.h"
            exit 1
          }
          Get-ChildItem -Recurse -File $prefix | ForEach-Object { $_.FullName }

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install 'pytest<9'

      # A skip is a failure on this leg: the test skips only when it finds no shared build (or,
      # for lumice_analytic, a CUDA configure), and this leg has just built one without CUDA. So
      # a skip here means the lookup missed the build — the green it would print is the one
      # outcome this job exists to rule out.
      # LUMICE_ANALYTIC_INSTALL_DIR hands the packaging step's prefix to the external-consumer
      # smoke test; each run: block is a new shell, so the path is rebuilt, not read from $prefix.
      - name: Check export sets, engine-hosted analytic capability, analytic log sink, EvaluatePath ABI & external consumer smoke
        shell: pwsh
        run: |
          $env:LUMICE_ANALYTIC_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'analytic-install'
          python -m pytest test/e2e-correctness/test_export_symbol_scope.py test/e2e-correctness/test_engine_hosts_analytic_capability.py test/e2e-correctness/test_analytic_log_sink.py test/e2e-correctness/test_analytic_evaluate_path.py test/e2e-correctness/test_external_consumer_smoke.py -v -m slow -rs 2>&1 | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (($log | Out-String) -match '\bskipped\b') {
            Write-Error "export-set test skipped on a leg that just built the shared flavor"
            exit 1
          }

  # The throughput benchmark, on main only, from an IPO build. It used to be a step of the
  # `build` matrix; it moved here when that matrix turned IPO off (LUMICE_IPO=OFF), because the
  # published curves are of what the release builds — with IPO — and switching the matrix's IPO
  # by event instead (on for main, off for PRs) would have split its compiler-cache namespace in
  # two and sent every PR's first run to a cold cache.
  #
  # Same four platforms, same `name`s and the same artifact names (`benchmark-<cache_key>`) as
  # the matrix entries it came from, because benchmark-summary keys the gh-pages series on them:
  # a renamed platform would start a new curve and orphan the old one. Only the CLI is built
  # (BUILD_TEST=OFF, BUILD_GUI=OFF): neither switch changes what lumice_obj or the Lumice target
  # compile — they only add targets — so the measured binary is the one the matrix used to
  # measure. No compiler cache: this job never runs on a PR, so its duration is off every PR's
  # critical path, and a cache here would be one more tenant of the 10 GB cache quota for no PR
  # gain. The CPM directory is restored from the build job's namespace and never saved, for the
  # same reason.
  #
  # Where CI still builds with IPO once the matrix does not (release.yml builds every release
  # artifact with it besides):
  #   - on every PR: e2e-test (GCC static; runs the e2e suite against it), E2E Slow Ubuntu
  #     (GCC shared), bench-compile and isa-v4-compile (GCC static), windows-isa-v3-compile
  #     (clang-cl static; runs the binary once), windows-shared-export clang-cl (clang-cl shared;
  #     reads the DLL export tables);
  #   - on main only, here: Apple Clang static and cl.exe /GL static, which no PR job builds.
  # One consequence of the matrix going non-LTO has already been met: with different inlining,
  # an FMA-contracted expression came out 1 ULP apart on ARM64, and a test that compared it
  # bit-for-bit went red. Unit tests comparing floating-point results should use a tolerance.
  #
  # `github.ref` is checked as well as the event even though `on: push` is filtered to main:
  # the condition says what it means rather than depending on a filter declared elsewhere.
  bench-ipo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x86_64
            os: ubuntu-24.04
            cache_key: ubuntu-x64
            benchmark_bin: build/Release/static/bin/Lumice
          - name: Ubuntu ARM64
            os: ubuntu-24.04-arm
            cache_key: ubuntu-arm64
            benchmark_bin: build/Release/static/bin/Lumice
          - name: macOS ARM64
            os: macos-15
            cache_key: macos-arm64
            benchmark_bin: build/Release/static/bin/Lumice
          # windows-2022 for the reason given on the build job's Windows entry.
          - name: Windows MSVC x86_64
            os: windows-2022
            cache_key: windows-msvc-x64
            msvc: true
            benchmark_bin: build/Release/static/bin/Lumice.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    name: Benchmark (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSVC
        if: matrix.msvc
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore CPM dependencies
        uses: actions/cache/restore@v6
        with:
          path: cpm_cache
          key: cpm-${{ matrix.cache_key }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: cpm-${{ matrix.cache_key }}-

      - name: Configure (IPO, CLI only)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TEST=OFF
          -DBUILD_GUI=OFF
          -DLUMICE_ISA_LEVEL=baseline

      - name: Build Lumice
        run: cmake --build build --target Lumice --parallel

      - name: Benchmark
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          # Collect CPU model for reference
          CPU_MODEL=""
          case "$(uname -s)" in
            Linux)  CPU_MODEL=$(lscpu | grep "Model name" | sed 's/.*: *//' | head -1) || true ;;
            Darwin) CPU_MODEL=$(sysctl -n machdep.cpu.brand_string) || true ;;
            *)      CPU_MODEL=$(powershell.exe -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" | tr -d '\r') || true ;;
          esac

          # Run dual-mode benchmark (outputs two [BENCHMARK] JSON lines)
          EXIT_CODE=0
          ${{ matrix.benchmark_bin }} benchmark -f examples/bench_config.json > benchmark_stdout.txt 2>&1 || EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo '{"error": "exit_code='"$EXIT_CODE"'"}' > benchmark-result.txt
          else
            # Extract both benchmark lines, inject platform and cpu_model into each
            grep '\[BENCHMARK\]' benchmark_stdout.txt | sed 's/^\[BENCHMARK\] //' | \
              jq --arg p "${{ matrix.name }}" --arg cpu "${CPU_MODEL:-unknown}" \
                 '. + {platform: $p, cpu_model: $cpu}' \
              > benchmark-result.txt
          fi
          cat benchmark-result.txt

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.cache_key }}
          path: benchmark-result.txt
          retention-days: 30

  # The `push` guard STAYS here, and now reads as "main only" — which is the
  # intent: this job publishes the benchmark history to gh-pages, and a PR must
  # not write to it.
  benchmark-summary:
    if: always() && github.event_name == 'push'
    needs: [bench-ipo]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Download benchmark artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: benchmark-*
          path: benchmarks

      - name: Generate summary
        run: |
          FMT_NUM() { echo "$1" | rev | sed 's/[0-9]\{3\}/&,/g' | rev | sed 's/^,//'; }

          echo "## CLI Benchmark Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platform | CPU | Cores | Workers | Single rps | Multi rps | Efficiency | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-----|-------|---------|------------|-----------|------------|--------|" >> "$GITHUB_STEP_SUMMARY"

          for f in benchmarks/benchmark-*/benchmark-result.txt; do
            if [ ! -f "$f" ]; then
              continue
            fi

            # Check for error (first line)
            FIRST_LINE=$(head -1 "$f")
            if echo "$FIRST_LINE" | jq -e '.error' > /dev/null 2>&1; then
              ERROR=$(echo "$FIRST_LINE" | jq -r '.error')
              echo "| (unknown) | - | - | - | - | - | - | CRASHED ($ERROR) |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # Parse single and multi mode lines
            SINGLE_LINE=$(jq -c 'select(.mode == "single")' "$f" 2>/dev/null | head -1)
            MULTI_LINE=$(jq -c 'select(.mode == "multi")' "$f" 2>/dev/null | head -1)

            if [ -z "$SINGLE_LINE" ] && [ -z "$MULTI_LINE" ]; then
              echo "| (unknown) | - | - | - | - | - | - | N/A (parse error) |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # Extract fields from whichever line is available
            REF_LINE="${MULTI_LINE:-$SINGLE_LINE}"
            PLATFORM=$(echo "$REF_LINE" | jq -r '.platform // "unknown"')
            CPU_MODEL=$(echo "$REF_LINE" | jq -r '.cpu_model // "-"' | cut -c1-35)
            CORES=$(echo "$REF_LINE" | jq -r '.cores // "-"')
            WORKERS=$(echo "$REF_LINE" | jq -r '.workers // "-"')

            SINGLE_RPS="-" ; MULTI_RPS="-" ; EFFICIENCY="-"
            if [ -n "$SINGLE_LINE" ]; then
              S_RPS=$(echo "$SINGLE_LINE" | jq -r '.rays_per_sec')
              SINGLE_RPS=$(FMT_NUM "$(printf '%.0f' "$S_RPS")")
            fi
            if [ -n "$MULTI_LINE" ]; then
              M_RPS=$(echo "$MULTI_LINE" | jq -r '.rays_per_sec')
              MULTI_RPS=$(FMT_NUM "$(printf '%.0f' "$M_RPS")")
            fi

            # Compute parallel efficiency: multi_rps / (single_rps × workers)
            if [ -n "$SINGLE_LINE" ] && [ -n "$MULTI_LINE" ]; then
              EFFICIENCY=$(awk "BEGIN {
                w = $(echo "$MULTI_LINE" | jq -r '.workers');
                if (w > 0 && $S_RPS > 0) printf \"%.0f%%\", ($M_RPS / ($S_RPS * w)) * 100;
                else print \"N/A\"
              }")
            fi

            echo "| $PLATFORM | $CPU_MODEL | $CORES | $WORKERS | $SINGLE_RPS | $MULTI_RPS | $EFFICIENCY | OK |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Transform benchmark data
        run: |
          # benchmark-result.txt format:
          # - Normal: 2-line NDJSON (mode=single + mode=multi)
          # - Error:  1-line JSON with .error field
          #
          # Output: 3 JSON files (one per metric), each containing entries keyed by platform.
          # This produces 3 charts with 4 lines each instead of 12 single-line charts.
          > bench-single-entries.ndjson
          > bench-multi-entries.ndjson
          > bench-efficiency-entries.ndjson
          for f in benchmarks/benchmark-*/benchmark-result.txt; do
            [ ! -f "$f" ] && continue
            head -1 "$f" | jq -e '.error' > /dev/null 2>&1 && continue

            SINGLE=$(jq -c 'select(.mode == "single")' "$f" 2>/dev/null | head -1)
            MULTI=$(jq -c 'select(.mode == "multi")' "$f" 2>/dev/null | head -1)

            S_RPS="" ; M_RPS=""
            if [ -n "$SINGLE" ]; then
              PLATFORM=$(echo "$SINGLE" | jq -r '.platform')
              RPS=$(echo "$SINGLE" | jq -r '.rays_per_sec')
              if [ "$RPS" != "null" ] && [ -n "$RPS" ]; then
                S_RPS="$RPS"
                CPU=$(echo "$SINGLE" | jq -r '.cpu_model // ""')
                CORES=$(echo "$SINGLE" | jq -r '.cores // 0')
                jq -n --arg name "$PLATFORM" \
                      --arg unit "rays/sec" --argjson value "$RPS" \
                      --arg extra "CPU: ${CPU}\nCores: ${CORES}" \
                      '{name: $name, unit: $unit, value: $value, extra: $extra}' \
                  >> bench-single-entries.ndjson
              else
                echo "::warning::Skipping ${PLATFORM}/single: RPS is null"
              fi
            fi

            if [ -n "$MULTI" ]; then
              PLATFORM=$(echo "$MULTI" | jq -r '.platform')
              RPS=$(echo "$MULTI" | jq -r '.rays_per_sec')
              if [ "$RPS" != "null" ] && [ -n "$RPS" ]; then
                M_RPS="$RPS"
                CPU=$(echo "$MULTI" | jq -r '.cpu_model // ""')
                CORES=$(echo "$MULTI" | jq -r '.cores // 0')
                jq -n --arg name "$PLATFORM" \
                      --arg unit "rays/sec" --argjson value "$RPS" \
                      --arg extra "CPU: ${CPU}\nCores: ${CORES}" \
                      '{name: $name, unit: $unit, value: $value, extra: $extra}' \
                  >> bench-multi-entries.ndjson
              else
                echo "::warning::Skipping ${PLATFORM}/multi: RPS is null"
              fi
            fi

            # Efficiency: self-referential metric, immune to runner hardware changes
            if [ -n "$S_RPS" ] && [ -n "$M_RPS" ] && [ -n "$MULTI" ]; then
              WORKERS=$(echo "$MULTI" | jq -r '.workers')
              PLATFORM=$(echo "$MULTI" | jq -r '.platform')
              if [ "$WORKERS" != "0" ] && [ "$S_RPS" != "0" ]; then
                EFF=$(awk "BEGIN {printf \"%.1f\", ($M_RPS / ($S_RPS * $WORKERS)) * 100}")
                jq -n --arg name "$PLATFORM" \
                      --arg unit "%" --argjson value "$EFF" \
                      '{name: $name, unit: $unit, value: $value}' \
                  >> bench-efficiency-entries.ndjson
              fi
            fi
          done

          # Convert NDJSON to JSON arrays; remove empty files to prevent Store steps from running
          for suffix in single multi efficiency; do
            jq -s '.' "bench-${suffix}-entries.ndjson" > "bench-${suffix}.json"
            echo "bench-${suffix}.json entries: $(jq length "bench-${suffix}.json")"
            cat "bench-${suffix}.json"
            jq -e 'length > 0' "bench-${suffix}.json" > /dev/null 2>&1 || rm -f "bench-${suffix}.json"
          done

      - name: Store benchmark result (single-worker)
        if: github.ref == 'refs/heads/main' && hashFiles('bench-single.json') != ''
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: "Single-worker Throughput"
          tool: customBiggerIsBetter
          output-file-path: bench-single.json
          benchmark-data-dir-path: bench
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "200%"
          comment-on-alert: true
          summary-always: true
          max-items-in-chart: 100

      - name: Store benchmark result (multi-worker)
        if: github.ref == 'refs/heads/main' && hashFiles('bench-multi.json') != ''
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: "Multi-worker Throughput"
          tool: customBiggerIsBetter
          output-file-path: bench-multi.json
          benchmark-data-dir-path: bench
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "200%"
          comment-on-alert: true
          summary-always: true
          max-items-in-chart: 100

      - name: Store benchmark result (efficiency)
        if: github.ref == 'refs/heads/main' && hashFiles('bench-efficiency.json') != ''
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: "Parallel Efficiency"
          tool: customBiggerIsBetter
          output-file-path: bench-efficiency.json
          benchmark-data-dir-path: bench
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "200%"
          comment-on-alert: true
          summary-always: true
          max-items-in-chart: 100

  # No job-level `if:` — see the note on the `build` job: the workflow-level
  # trigger pair already gives one run per PR and one per push to main.
  format-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check clang-format
        run: |
          find src test bench -name '*.cpp' -o -name '*.hpp' -o -name '*.h' -o -name '*.cc' -o -name '*.inl' | \
            xargs clang-format --dry-run --Werror 2>&1

  # Engineering-policy gate (separate from format-check above): env-knob
  # centralization + registration, GUI/core API boundary, no `using namespace`.
  # Version-independent — the executable half of doc/env-var-policy.md + AGENTS.md.
  # No job-level `if:` — see the note on the `build` job.
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Policy checks (env knobs / API boundary / using-namespace)
        run: python3 scripts/check_policies.py

      - name: Install Python dependencies
        # Capped at the current major: this job gates every commit, so a pytest
        # release that changes collection or tokenizer behaviour would block the
        # repo on a day nobody touched it. Raise the cap deliberately instead.
        run: pip install 'pytest<9'

      # The gates' own unit tests live here rather than in the e2e pytest run:
      # they need no build and must run on every commit, which is this job's
      # cadence and not that one's (it is PR/main-only and waits on a compile).
      # They are excluded from pyproject's testpaths for the same reason, so
      # they have to be named explicitly here.
      - name: Unit tests for the policy gates
        run: python3 -m pytest test/unit-correctness/scripts -q

  # Diff-scoped siblings of the policy gate above: both ask what THIS PR added
  # rather than what state the tree is in, and both need a merge-base, which is
  # why they share one job and one fetch-depth-0 checkout. The pre-commit hook
  # covers the local side of each.
  #
  #   1. Prose added by this PR must not cite the git-ignored per-task working
  #      notes (they are archived on close, so the reference dangles).
  #   2. A gui_test case registered by this PR must actually use its
  #      ImGuiTestContext; one that does not belongs in gui_unit_test, which —
  #      unlike gui_test — runs here on every platform.
  #   3. A `for` loop added by this PR must not fatal-assert directly in its body
  #      (see check_loop_fatal_asserts.py's docstring for the defect shape).
  #
  # None of the three reads pre-existing content, so the existing body of any
  # kind never blocks anyone.
  new-refs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: New-reference check (added lines vs merge-base)
        run: |
          base=$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)
          python3 scripts/check_new_refs.py --range "$base..HEAD"

      - name: New-gui-test check (cases registered vs merge-base)
        run: |
          base=$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)
          python3 scripts/check_new_gui_tests.py --range "$base..HEAD"

      - name: Loop-fatal-assert check (added lines vs merge-base)
        run: |
          base=$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)
          python3 scripts/check_loop_fatal_asserts.py --range "$base..HEAD"
